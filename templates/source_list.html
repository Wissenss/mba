<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBA - List</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png')}}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/theme.css') }}"/>
</head>
<body>
    <a href="{{ url_for('get_contributors') }}">[contributors]</a>
    
    <h2>available sources</h2>

    <ul>
        {% for s in sources %}
            <li>
                <a href="/source/{{ s.id }}/render?height=500&width=900&strip_width=20&max_strips=1000&kind=0&radius=2000&radius_inner=200&f_=0">{{s.metadata_name}} ({{s.metadata_year}}) ({{s.id}})</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
